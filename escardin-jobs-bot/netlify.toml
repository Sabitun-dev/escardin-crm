# Netlify settings for Escardin Jobs Bot.
# Every push to GitHub runs this build. If the type check or the tests fail,
# Netlify keeps the previous working version live, so a broken edit never goes out.

[build]
  command = "npm run typecheck && npm test"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
